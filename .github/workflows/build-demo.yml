# Build mediadevices demo binaries for macOS, Linux, Windows
name: Build Demo

permissions:
  contents: write

on:
  workflow_dispatch: {}
  release:
    types: [created]

jobs:
  test:
    name: smoke-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.37.2

      - name: Install Windows toolchain (msys2)
        if: startsWith(matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
          msystem: MINGW64

      - name: Windows toolchain env (msys2)
        if: startsWith(matrix.os, 'windows')
        run: |
          $mingwBin = "C:\msys64\mingw64\bin"
          if (-not (Test-Path (Join-Path $mingwBin 'gcc.exe'))) {
            Write-Error "gcc.exe not found at $mingwBin"
            exit 1
          }
          $libPath = Split-Path $mingwBin
          echo "CC=$(Join-Path $mingwBin 'gcc.exe')" >> $env:GITHUB_ENV
          echo "CXX=$(Join-Path $mingwBin 'g++.exe')" >> $env:GITHUB_ENV
          echo "PKG_CONFIG=$(Join-Path $mingwBin 'pkg-config.exe')" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-L$libPath\.." >> $env:GITHUB_ENV
          echo "PATH=$mingwBin;$env:PATH" >> $env:GITHUB_ENV

      - name: Smoke test demo (no download)
        env:
          GOWORK: off
        run: task mediadevices:demo

      - name: Smoke test demo (download/upgrade codecs)
        env:
          GOWORK: off
        run: task mediadevices:demo:install -- -version codecs-v0.1.0

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            goos: darwin
            goarch: arm64
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64

    runs-on: ${{ matrix.os }}
    name: demo-${{ matrix.goos }}-${{ matrix.goarch }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Windows toolchain (msys2)
        if: startsWith(matrix.os, 'windows')
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-pkgconf
          msystem: MINGW64

      - name: Windows toolchain env (msys2)
        if: startsWith(matrix.os, 'windows')
        run: |
          $mingwBin = "C:\msys64\mingw64\bin"
          if (-not (Test-Path (Join-Path $mingwBin 'gcc.exe'))) {
            Write-Error "gcc.exe not found at $mingwBin"
            exit 1
          }
          $libPath = Split-Path $mingwBin
          echo "CC=$(Join-Path $mingwBin 'gcc.exe')" >> $env:GITHUB_ENV
          echo "CXX=$(Join-Path $mingwBin 'g++.exe')" >> $env:GITHUB_ENV
          echo "PKG_CONFIG=$(Join-Path $mingwBin 'pkg-config.exe')" >> $env:GITHUB_ENV
          echo "CGO_LDFLAGS=-L$libPath\.." >> $env:GITHUB_ENV
          echo "PATH=$mingwBin;$env:PATH" >> $env:GITHUB_ENV

      - name: Build demo
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          go build -o dist/mediadevices-demo-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/mediadevices-demo

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediadevices-demo-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/mediadevices-demo-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    needs: [build]
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'release'
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/mediadevices-demo-*
          fail_on_unmatched_files: false

      - name: Create release from dispatch
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: demo-${{ github.run_id }}
          name: Mediadevices Demo ${{ github.run_id }}
          body: |
            Prebuilt mediadevices demo binaries (OpenH264 + videotest; no system codecs required).

            Usage:
            - macOS/Linux: make executable and run `GOWORK=off ./mediadevices-demo-*`
            - Windows: run `mediadevices-demo-windows-amd64.exe`

            Note: Requires CGO-capable system; binaries include static OpenH264.
          files: artifacts/*/mediadevices-demo-*
          fail_on_unmatched_files: false
