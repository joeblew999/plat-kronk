# xplat.yaml - Package manifest for xplat ecosystem
apiVersion: xplat/v1
kind: Package

name: kronk
version: main
description: WebRTC codec experiments (OpenH264, mediadevices)
author: Gerard Webb
license: MIT

# Subsystems provide binaries via bin:download tasks
# Each subsystem follows CLAUDE.md conventions

taskfile:
  path: Taskfile.yml
  namespace: kronk

# Subsystems that provide downloadable binaries
subsystems:
  caddy:
    description: Caddy reverse proxy
    version: 2.10.2
    platforms: [darwin, linux, windows]
    architectures: [amd64, arm64, armv7]

  cloudflared:
    description: Cloudflare Tunnel
    version: latest
    platforms: [darwin, linux, windows]
    architectures: [amd64, arm64, arm]

  livekit:
    description: LiveKit WebRTC SFU
    version: 1.9.9
    platforms: [linux, windows]  # macOS builds from source
    architectures: [amd64, arm64, armv7]

# Build dependencies
dependencies:
  build:
    - go
