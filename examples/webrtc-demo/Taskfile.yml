version: '3'

vars:
  RECORD_DIR: '{{.TASKFILE_DIR}}/recordings'
  DEMO_PORT: 9080
  PC_FILE: '{{.TASKFILE_DIR}}/process-compose.yml'
  PC_SOCKET: '{{.TASKFILE_DIR}}/.pc.sock'
  CMD_DIR: '{{.TASKFILE_DIR}}'
  # Cloudflared log path - uses shell to get absolute path
  CF_LOG:
    sh: echo "$(cd {{.TASKFILE_DIR}}/../.. && pwd)/cloudflared/.data/cloudflared.log"

tasks:
  default:
    desc: List available tasks
    cmds:
      - task -l

  up:
    desc: Start all services
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - rm -f "$(cd {{.TASKFILE_DIR}}/../.. && pwd)/cloudflared/.data/cloudflared.log"
      - xplat process -f {{.PC_FILE}} -t=false -U -u {{.PC_SOCKET}}

  attach:
    desc: Attach TUI to running services
    dir: '{{.TASKFILE_DIR}}'
    cmds:
      - xplat process attach -U -u {{.PC_SOCKET}}

  down:
    desc: Stop all processes
    cmds:
      - pkill -f "process-compose" || true
      - pkill -f "livekit-server" || true
      - pkill -f "webrtc-demo" || true
      - pkill -f "cloudflared" || true
      - caddy stop 2>/dev/null || true
      - rm -f "$(cd {{.TASKFILE_DIR}}/../.. && pwd)/cloudflared/.data/cloudflared.log"
      - rm -f {{.PC_SOCKET}}

  demo:
    desc: Run the Livekit demo server (uses LIVEKIT_* env vars or defaults)
    vars:
      # Default values for development - override via environment
      API_KEY: '{{.LIVEKIT_API_KEY | default "devkey"}}'
      API_SECRET: '{{.LIVEKIT_API_SECRET | default "n2Z2GBJV8l6Jggu85GWnID5LRmRThuYjgy2VLV8GGnKPqs26"}}'
      HOST: '{{.LIVEKIT_HOST | default "ws://localhost:7880"}}'
    env:
      GOWORK: off
      LIVEKIT_API_KEY: '{{.API_KEY}}'
      LIVEKIT_API_SECRET: '{{.API_SECRET}}'
      LIVEKIT_HOST: '{{.HOST}}'
      CF_LOG: '{{.CF_LOG}}'
    cmds:
      - go run {{.CMD_DIR}} -addr :{{.DEMO_PORT}}

  clean:
    desc: Clean recordings
    cmds:
      - rm -rf {{.RECORD_DIR}}
