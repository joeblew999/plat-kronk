version: '3'

dotenv: ['.env']

includes:
  caddy: ./caddy/Taskfile.yml
  cloudflared: ./cloudflared/Taskfile.yml
  codecs: ./codecs/Taskfile.yml
  livekit: ./livekit/Taskfile.yml
  mediadevices: ./examples/mediadevices-demo/Taskfile.yml
  webrtc: ./examples/webrtc-demo/Taskfile.yml

tasks:
  default:
    desc: Show available tasks
    cmds:
      - task -l

  env:init:
    desc: Generate .env file with random LiveKit secret (alias for env:ensure)
    cmds:
      - task: env:ensure

  env:ensure:
    desc: Ensure .env file exists with generated secrets
    cmds:
      - |
        if [ ! -f .env ]; then
          echo "Generating .env file with LIVEKIT_API_SECRET..."
          # Generate 48-character random secret
          if command -v openssl >/dev/null 2>&1; then
            SECRET=$(openssl rand -base64 36)
          elif command -v head >/dev/null 2>&1 && [ -e /dev/urandom ]; then
            SECRET=$(head -c 36 /dev/urandom | base64)
          else
            echo "Error: No secure random source available" >&2
            exit 1
          fi
          echo "LIVEKIT_API_KEY=devkey" > .env
          echo "LIVEKIT_API_SECRET=${SECRET}" >> .env
          echo "LIVEKIT_HOST=ws://localhost:7880" >> .env
          echo ".env file created"
        else
          echo ".env already exists, skipping"
        fi
    status:
      - test -f .env

  env:show:
    desc: Show current environment variables (masks secrets)
    cmds:
      - |
        if [ -f .env ]; then
          echo "Current .env configuration:"
          cat .env | sed 's/\(LIVEKIT_API_SECRET=\).*/\1***MASKED***/'
        else
          echo "No .env file found. Using hardcoded defaults."
          echo "Run 'xplat task env:init' to generate secure secrets."
        fi
